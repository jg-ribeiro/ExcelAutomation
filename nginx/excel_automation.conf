# ================================================================================
# Configuração Nginx para Excel Automation VM
# ================================================================================
# Esta configuração serve o frontend React + TypeScript compilado e encaminha
# as requisições de API e SSE para o servidor FastAPI (uvicorn) na porta 8000.
#
# Para utilizar no Nginx instalado em C:\nginx:
# 1. Copie ou inclua este arquivo dentro de C:\nginx\conf\nginx.conf (no bloco http { ... }):
#    include C:/Auteq/ExcelAutomationVM/nginx/excel_automation.conf;
# 2. Recarregue o Nginx:
#    C:\nginx\nginx.exe -s reload
# ================================================================================

server {
    listen       80;
    server_name  localhost;

    # Compressão Gzip para performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend React SPA compilado
    location / {
        root   C:/Auteq/ExcelAutomationVM/frontend/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Cache de assets imutáveis gerados pelo Vite
        location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy reverso para API REST FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentação Swagger da API
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Streaming de Logs em Tempo Real (Server-Sent Events - SSE)
    location /api/logs/stream {
        proxy_pass http://127.0.0.1:8000/api/logs/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
