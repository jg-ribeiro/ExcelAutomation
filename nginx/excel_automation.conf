# ================================================================================
# Configuração Nginx para Excel Automation VM
# Endereço de acesso no servidor: https://usa9robogi1/excel-automation/
# ================================================================================
# Esta configuração serve o frontend React compilado em /excel-automation/
# e faz proxy reverso da API e streaming de logs SSE para o FastAPI na porta 8000.
#
# Para utilizar no Nginx instalado em C:\nginx:
# 1. Copie ou inclua este arquivo dentro de C:\nginx\conf\nginx.conf (no bloco http { ... }):
#    include C:/Auteq/ExcelAutomationVM/nginx/excel_automation.conf;
# 2. Recarregue o Nginx:
#    C:\nginx\nginx.exe -p C:\nginx -s reload
# ================================================================================

server {
    listen       80;
    server_name  localhost usa9robogi1;

    # Compressão Gzip para performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ============================================================================
    # 1. Roteamento do Frontend React SPA sob o subpath /excel-automation/
    # ============================================================================
    location /excel-automation/ {
        alias      C:/Auteq/ExcelAutomationVM/frontend/dist/;
        index      index.html;
        try_files  $uri $uri/ /excel-automation/index.html;

        # Cache de assets imutáveis gerados pelo Vite
        location ~* ^/excel-automation/assets/.+\.(?:css|js|woff2?|svg|png|jpg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Redireciona /excel-automation para /excel-automation/ com barra final
    location = /excel-automation {
        return 301 /excel-automation/;
    }

    # ============================================================================
    # 2. Proxy reverso para API REST FastAPI sob /excel-automation/api/
    # ============================================================================
    location /excel-automation/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /excel-automation;
    }

    # ============================================================================
    # 3. Streaming de Logs em Tempo Real (Server-Sent Events - SSE)
    # ============================================================================
    location /excel-automation/api/logs/stream {
        proxy_pass http://127.0.0.1:8000/api/logs/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============================================================================
    # 4. Documentação Swagger da API
    # ============================================================================
    location /excel-automation/docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /excel-automation;
    }
    location /excel-automation/openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # ============================================================================
    # 5. Compatibilidade caso acesse diretamente na raiz / (opcional)
    # ============================================================================
    location / {
        return 301 /excel-automation/;
    }
}
